    var viewer = new Cesium.Viewer('cesiumContainer', {
        geocoder: false,
        homeButton: true,
        sceneModePicker: false,
        fullscreenButton: false,
        vrButton: false,
        baseLayerPicker: true,
        infoBox: false,
        selectionIndicator: false,
        animation: true,

        //开启会和坐标显示框重合
        timeline: true,
        shouldAnimate: true,
        navigationHelpButton: true,
        navigationInstructionsInitiallyVisible: false,
    })
    //隐藏版权信息
    viewer._cesiumWidget._creditContainer.style.display = "none";
    //关闭日照阴影
    viewer.scene.globe.enableLighting = false;
    //开启深度检测
    viewer.scene.globe.depthTestAgainstTerrain = true;
    //关闭/开启大气层
    viewer.scene.globe.showGroundAtmosphere = false;

    $('#czmlFiles').change(function (){
        let fileBox=document.getElementById('czmlFiles');
        let fileList=fileBox.files;
        let file=fileList[0];
        //读到选中的文件
        console.log("file="+file);

        Cesium.CzmlDataSource.load(file);
        readCzml(file);
        function readCzml(file) {
            let reader=new FileReader();
            console.log("reader="+reader)
            reader.readAsDataURL(file);
            reader.onload=()=>{

                Cesium.KmlDataSource.load(reader.result).then((KmlDataSource)=>{
                    console.log(KmlDataSource);
                });
            }
        }
