<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEM实验对比可视化（Cesium）</title>
  <link rel="stylesheet" href="../../libs/cesium/Widgets/widgets.css" />
  <style>
    html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #viewer { position: absolute; left: 0; top: 0; right: 360px; bottom: 0; }
    #panel {
      position: absolute; top: 0; right: 0; width: 360px; bottom: 0;
      background: rgba(18, 24, 32, 0.96); color: #e8edf5; border-left: 1px solid #2a3442;
      overflow-y: auto; padding: 12px;
    }
    .title { font-size: 16px; font-weight: 700; margin: 0 0 10px 0; }
    .small { font-size: 12px; color: #a9b4c2; }
    .row { margin-bottom: 10px; }
    .row label { font-size: 12px; display: block; margin-bottom: 4px; color: #c8d1dd; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #3a485a;
      background: #0e141c; color: #e8edf5; border-radius: 4px;
    }
    button {
      width: 100%; padding: 8px; border: 0; border-radius: 4px; cursor: pointer;
      background: #2f81f7; color: white; font-weight: 600;
    }
    button:hover { background: #1f6feb; }
    .card { border: 1px solid #2b3746; border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #111a24; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #2f3b4b; padding: 4px 6px; text-align: left; }
    th { color: #aac1de; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #111; }
    .status { font-size: 12px; margin-top: 6px; color: #f2cc60; white-space: pre-wrap; }
  </style>
</head>
<body>
<div id="app">
  <div id="viewer"></div>
  <aside id="panel">
    <h1 class="title">DEM实验对比（Cesium）</h1>
    <div class="small row">用于在你的 Cesium 项目内展示实验路径对比、模型指标与方向性统计。</div>

    <div class="row">
      <label for="outFolder">实验输出目录（相对当前HTML）</label>
      <input id="outFolder" type="text" value="./output/20260510_175400" />
    </div>
    <div class="row"><button id="loadBtn">加载并可视化</button></div>
    <div id="status" class="status">等待加载...</div>

    <div class="card">
      <div><strong>路径显示开关</strong></div>
      <div id="layerToggles"></div>
    </div>

    <div class="card">
      <div><strong>消融均值指标</strong></div>
      <table id="ablationTable">
        <thead>
        <tr><th>模型</th><th>总代价</th><th>单位爬升</th><th>曲折率</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <div><strong>方向性与稳定性</strong></div>
      <table id="testTable"><tbody></tbody></table>
    </div>

    <div class="card">
      <div><strong>图例</strong></div>
      <div class="legend-item"><span class="swatch" style="background:#00d4ff"></span>B0</div>
      <div class="legend-item"><span class="swatch" style="background:#ffd166"></span>B1</div>
      <div class="legend-item"><span class="swatch" style="background:#ff5ea1"></span>B2</div>
      <div class="legend-item"><span class="swatch" style="background:#8fff00"></span>B3</div>
      <div class="legend-item"><span class="swatch" style="background:#ff3b30"></span>OURS</div>
      <div class="legend-item"><span class="swatch" style="background:#6fd3ff"></span>START</div>
      <div class="legend-item"><span class="swatch" style="background:#ffffff"></span>END</div>
    </div>
  </aside>
</div>

<script src="../../libs/cesium/Cesium.js"></script>
<script>
  window.CESIUM_BASE_URL = "../../libs/cesium/";

  const modelColor = {
    B0: Cesium.Color.fromCssColorString("#00d4ff"),
    B1: Cesium.Color.fromCssColorString("#ffd166"),
    B2: Cesium.Color.fromCssColorString("#ff5ea1"),
    B3: Cesium.Color.fromCssColorString("#8fff00"),
    OURS: Cesium.Color.fromCssColorString("#ff3b30"),
  };

  const statusEl = document.getElementById("status");
  const togglesEl = document.getElementById("layerToggles");
  const ablationTBody = document.querySelector("#ablationTable tbody");
  const testTBody = document.querySelector("#testTable tbody");
  const loadBtn = document.getElementById("loadBtn");
  const folderEl = document.getElementById("outFolder");

  const viewer = new Cesium.Viewer("viewer", {
    animation: false,
    timeline: false,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: true,
    sceneModePicker: true,
    navigationHelpButton: false,
    infoBox: true,
    selectionIndicator: true,
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#10202a");

  let loadedEntities = [];
  let pathEntitiesByModel = {};

  function setStatus(text, isErr = false) {
    statusEl.style.color = isErr ? "#ff8e8e" : "#f2cc60";
    statusEl.textContent = text;
  }

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`加载失败 ${url} (HTTP ${r.status})`);
    return await r.json();
  }

  function clearLoaded() {
    for (const e of loadedEntities) {
      viewer.entities.remove(e);
    }
    loadedEntities = [];
    pathEntitiesByModel = {};
    togglesEl.innerHTML = "";
  }

  function addMetricRow(k, v) {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.textContent = k;
    const td2 = document.createElement("td");
    td2.textContent = String(v);
    tr.appendChild(td1);
    tr.appendChild(td2);
    testTBody.appendChild(tr);
  }

  function renderTables(viewerMetrics) {
    ablationTBody.innerHTML = "";
    testTBody.innerHTML = "";

    const arr = (viewerMetrics && viewerMetrics.ablation_mean_metrics) || [];
    for (const row of arr) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${row.model}</td><td>${Number(row.mean_total_cost).toFixed(2)}</td><td>${Number(row.mean_ascent_per_meter).toFixed(4)}</td><td>${Number(row.mean_tortuosity).toFixed(4)}</td>`;
      ablationTBody.appendChild(tr);
    }

    const h = (viewerMetrics && viewerMetrics.hypothesis_tests) || {};
    if (h.H2_directionality) {
      addMetricRow("H2 正向均值代价", Number(h.H2_directionality.forward_mean_cost).toFixed(2));
      addMetricRow("H2 反向均值代价", Number(h.H2_directionality.reverse_mean_cost).toFixed(2));
      addMetricRow("H2 正反路径重合度", Number(h.H2_directionality.path_overlap_forward_reverse_mean).toFixed(4));
    }
    if (h.H3_multiscale_stability) {
      addMetricRow("H3 Hausdorff均值", Number(h.H3_multiscale_stability.ours_hausdorff_mean).toFixed(4));
      addMetricRow("H3 Hausdorff标准差", Number(h.H3_multiscale_stability.ours_hausdorff_std).toFixed(4));
    }
    if (h.H1_ours_vs_b0_total_cost && h.H1_ours_vs_b0_total_cost.sign_test) {
      addMetricRow("H1(总代价) p值", Number(h.H1_ours_vs_b0_total_cost.sign_test.p_value).toExponential(3));
    }
  }

  function addToggle(model) {
    const id = `tg_${model}`;
    const div = document.createElement("div");
    div.className = "legend-item";
    div.innerHTML = `<input type="checkbox" id="${id}" checked /><label for="${id}" style="cursor:pointer;">${model}</label>`;
    togglesEl.appendChild(div);
    const cb = div.querySelector("input");
    cb.addEventListener("change", () => {
      const arr = pathEntitiesByModel[model] || [];
      for (const e of arr) e.show = cb.checked;
    });
  }

  function renderGeojson(fc) {
    if (!fc || !Array.isArray(fc.features)) return;
    let first = null;

    for (const f of fc.features) {
      const p = f.properties || {};
      const g = f.geometry || {};
      if (g.type === "LineString" && Array.isArray(g.coordinates)) {
        const m = p.model || "UNK";
        const coords = [];
        for (const c of g.coordinates) {
          if (!Array.isArray(c) || c.length < 2) continue;
          coords.push(c[0], c[1]);
          if (!first) first = c;
        }
        const ent = viewer.entities.add({
          name: `Path-${m}`,
          description: `模型: ${m}<br>总代价: ${p.total_cost ?? "N/A"}<br>节点数: ${p.node_count ?? "N/A"}`,
          polyline: {
            positions: Cesium.Cartesian3.fromDegreesArray(coords),
            width: m === "OURS" ? 5 : 3,
            material: (modelColor[m] || Cesium.Color.WHITE).withAlpha(0.95),
          }
        });
        loadedEntities.push(ent);
        if (!pathEntitiesByModel[m]) pathEntitiesByModel[m] = [];
        pathEntitiesByModel[m].push(ent);
      } else if (g.type === "Point" && Array.isArray(g.coordinates)) {
        const name = p.name || "POINT";
        const color = name === "START" ? Cesium.Color.fromCssColorString("#6fd3ff") : Cesium.Color.WHITE;
        const ent = viewer.entities.add({
          name,
          position: Cesium.Cartesian3.fromDegrees(g.coordinates[0], g.coordinates[1]),
          point: {
            pixelSize: 12,
            color,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
          },
          label: {
            text: name,
            fillColor: color,
            showBackground: true,
            backgroundColor: Cesium.Color.BLACK.withAlpha(0.5),
            pixelOffset: new Cesium.Cartesian2(0, -20),
            font: "14px sans-serif",
          }
        });
        loadedEntities.push(ent);
        if (!first) first = g.coordinates;
      }
    }

    Object.keys(pathEntitiesByModel).sort().forEach(addToggle);
    if (first) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(first[0], first[1], 180000),
        duration: 1.2,
      });
    }
  }

  async function loadAll() {
    clearLoaded();
    const folder = folderEl.value.trim().replace(/\/+$/, "");
    if (!folder) return;
    setStatus("正在加载实验输出...");
    try {
      const [viewerMetrics, geojson] = await Promise.all([
        getJson(`${folder}/viewer_metrics.json`),
        getJson(`${folder}/sample_paths.geojson`),
      ]);
      renderTables(viewerMetrics);
      renderGeojson(geojson);
      setStatus(`加载完成：${folder}`);
    } catch (e) {
      console.error(e);
      setStatus(`加载失败：${e.message}\n请确认你是通过Live Server打开页面，且输出目录存在 sample_paths.geojson`, true);
    }
  }

  loadBtn.addEventListener("click", loadAll);
  loadAll();
</script>
</body>
</html>
