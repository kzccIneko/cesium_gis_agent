    /*1. 添加轨迹点*/
    // 创建Cesium视锥体
    const frustum = new Cesium.PerspectiveFrustum({
        fov: Cesium.Math.PI_OVER_THREE,
        aspectRatio: canvas.clientWidth / canvas.clientHeight,
        near: 1.0,
        far: 1000.0
    });
    const camera = viewer.scene.camera;
    camera.frustum = frustum;
    const planes=frustum._offCenterFrustum._cullingVolume.planes
    console.log(planes)

    const viewMatrix = camera.viewMatrix;
    const worldPlanes = planes.map(plane => {
        const normal = new Cesium.Cartesian3(plane.normal.x, plane.normal.y, plane.normal.z);
        const distance = plane.distance;
        const transformedNormal = Cesium.Matrix3.transpose(Cesium.Matrix4.getMatrix3(viewMatrix, new Cesium.Matrix3()), new Cesium.Matrix3()).multiplyByVector(normal, new Cesium.Cartesian3());
        const transformedDistance = distance - Cesium.Cartesian3.dot(transformedNormal, camera.positionWC);
        return new Cesium.Cartesian4(transformedNormal.x, transformedNormal.y, transformedNormal.z, -transformedDistance);
    });


    console.log(worldPlanes);
